[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "avm-workspace"
version = "0.1.0"
description = "AVM: realtime full-duplex audio-video dialogue without text, based on LatentLoop"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate==1.14.0",
  "hydra-core==1.3.4",
  "numpy>=1.26,<3",
  "safetensors==0.8.0",
  "soundfile>=0.13,<1",
  "torch==2.13.0",
  "wandb==0.28.1",
  "webdataset==1.0.2",
]

[project.optional-dependencies]
ray = ["ray[data]==2.56.1"]
minicpm = [
  "bitsandbytes==0.50.0",
  "peft==0.20.0",
  "transformers==5.14.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
data = "data.cli:main"
training = "training.cli:main"

[tool.uv.workspace]
members = [
  "packages/contracts",
  "packages/model",
  "packages/media",
  "packages/data",
  "packages/runtime",
  "systems/model-service",
  "systems/training",
  "systems/harness",
]

[tool.uv]
package = false

[tool.uv.sources]
latentloop-contracts = { workspace = true }
latentloop-model = { workspace = true }
latentloop-media = { workspace = true }
latentloop-data = { workspace = true }
latentloop-runtime = { workspace = true }
harness = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
