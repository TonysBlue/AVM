syntax = "proto3";

package avm.realtime.v1;

message MicPcm {
  uint32 sample_rate_hz = 1;
  uint32 channels = 2;
  string encoding = 3;
  bytes samples = 4;
}

message VideoFrame {
  uint32 width = 1;
  uint32 height = 2;
  uint64 captured_at_ms = 3;
  uint64 revision = 4;
  string pixel_format = 5;
  string encoding = 6;
  bytes image = 7;
}

message ObservationSignal {
  string protocol_version = 100;
  string session_id = 1;
  uint64 unit_index = 2;
  uint64 timestamp_ms = 3;
  uint32 delta_ms = 4;
  MicPcm mic = 5;
  VideoFrame video = 6;
}

message SpeechSignal {
  uint32 sample_rate_hz = 1;
  uint32 channels = 2;
  string encoding = 3;
  bool silent = 4;
  bytes pcm = 5;
}

message ActuationSignal {
  string protocol_version = 100;
  string session_id = 1;
  uint64 unit_index = 2;
  SpeechSignal speech = 3;
  reserved 4;
}

message EnvironmentReceipt {
  string session_id = 1;
  uint64 unit_index = 2;
  bool accepted = 3;
  double execution_latency_ms = 4;
  string safety_violation = 5;
  bool terminated = 6;
  string infrastructure_failure = 7;
}
