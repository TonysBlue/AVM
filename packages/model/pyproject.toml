[project]
name = "latentloop-model"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["latentloop-contracts", "latentloop-runtime", "torch==2.13.0", "safetensors==0.8.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model"]
