[project]
name = "latentloop-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["latentloop-contracts", "omegaconf>=2.3,<3", "numpy>=1.26,<3", "torch==2.13.0", "pillow>=11,<13"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime"]
