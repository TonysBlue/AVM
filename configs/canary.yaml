# Canary uses the complete Pretrain -> SFT -> Online RL recipe on a small real
# dataset. Online RL uses Online Recurrent PPO; all three formal stages train the full model.
model:
  model_dim: 192
  num_layers: 8
  num_heads: 8
  ffn_dim: 768
  audio_tokens: 4
  audio_kernel: 400
  audio_stride: 160
  vision_tokens: 16
  perceiver_slots: 16
  perceiver_layers: 2
  jepa_layers: 2
  semantic_memory_slots: 8
  slow_memory_type: gated_delta
  rematerialization_segment_units: 32
  delta_time_fourier_bands: 8
  delta_time_base_period_ms: 80
  kv_units: 375
  kv_window_ms: 30000
  speech_frames_per_unit: 1
  speech_codebooks: 8
  speech_codebook_size: 2048
  speech_depth_layers: 2
  speech_depth_heads: 4
  speech_depth_ffn_dim: 384
  dropout: 0.1
  activation_checkpointing: false
data:
  dataset: canary
  source: webdataset
  shards: ~/latentloop-data/datasets/canary/shards/processed/train/train-*.tar
  manifest: ~/latentloop-data/datasets/canary/shards/processed/train/train-manifest.jsonl
  audio_sample_rate: 24000
  codec_frame_rate: 12.5
  codec_id: mimi-24khz-8x2048
  codec_weight_hash: 09b782f0629851a271227fb9d36db65c041790365f11bbe5d3d59369cf863f50
  codec_revision: a49141e28b3d9c947cf9aa5314431e1b11cbd2f5
  codec_codebooks: 8
  codec_codebook_size: 2048
  unit_ms: 80
  unit_audio_samples: 1920
  video_height: 224
  video_width: 224
  episode_units: 375
  train_episodes: 1000
  seed: 17
training:
  stage: pretrain
  max_updates: 1000
  weight_decay: 0.1
  gradient_accumulation_steps: 16
  tbptt_units: 375
  mixed_precision: fp16
  max_grad_norm: 1.0
  checkpoint_every: 250
  log_every: 1
  head_learning_rate: 0.0001
  backbone_learning_rate: 0.00003
  warmup_ratio: 0.03
  codec_scheduled_sampling: 0.1
  codec_scheduled_sampling_start: 0.7
  backbone_train_mode: all
  speech_loss_weight: 1.0
  jepa_loss_weight: 1.0
  memory_horizon_units: 375
  min_learning_rate_ratio: 0.1
  rl:
    algorithm: online_recurrent_ppo
    ppo_window_units: 375
    ppo_epochs: 4
    candidate_max_reference_kl: 1.0
    candidate_max_eval_loss_ratio: 1.25
    candidate_max_rejections: 3
    clip_epsilon: 0.2
    reference_kl_beta: 0.02
    environment_socket: ~/latentloop-data/runtime/canary/harness-control.sock
    codec_socket: ~/latentloop-data/runtime/sockets/mimi.sock
    reward_socket: ~/latentloop-data/runtime/canary/reward-judge.sock
    environment_id: avm-dialogue
    environment_version: "1"
    environment_protocol_version: avm-realtime-v1
    reward_spec_id: avm-dialogue-v1
    judge_model_id: external-frozen-multimodal
    judge_revision: locked-canary
    rubric_sha256: b6f942e66d31d5e8767438f55a52c51150cd9a7ae33be7c3f477c0484710e87e
    timeline_root: ~/latentloop-data/runtime/canary/timeline
    session_manifest: ~/latentloop-data/datasets/canary/rl/sessions.jsonl
    sft_replay_shards: ~/latentloop-data/datasets/canary/shards/processed/train/train-*.tar
    sft_replay_manifest: ~/latentloop-data/datasets/canary/shards/processed/train/train-manifest.jsonl
    sft_preservation_shards: ~/latentloop-data/datasets/canary/shards/processed/validation/validation-*.tar
    sft_preservation_manifest: ~/latentloop-data/datasets/canary/shards/processed/validation/validation-manifest.jsonl
    sampling_temperature: 0.8
    sampling_top_k: 0
tracking:
  enabled: true
  project: avm
  mode: online
  base_url: http://127.0.0.1:8080
  media_samples_per_run: 4
  media_warning_gb: 40
  media_stop_gb: 50
runtime:
  data_root: ~/latentloop-data/datasets
  experiment_root: ~/latentloop-data/experiments/canary/standalone
