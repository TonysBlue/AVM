# Canary uses the complete Pretrain -> SFT -> Online RL recipe on a small real
# dataset. Online RL uses Online Recurrent PPO; all three formal stages train the full model.
model:
  model_dim: 4096
  num_layers: 36
  num_heads: 32
  ffn_dim: 12288
  audio_tokens: 2
  audio_kernel: 400
  audio_stride: 160
  vision_tokens: 64
  perceiver_slots: 64
  perceiver_layers: 2
  jepa_layers: 2
  semantic_memory_slots: 16
  slow_memory_type: gated_delta
  rematerialization_segment_units: 32
  kv_units: 150
  kv_window_ms: 30000
  speech_frames_per_unit: 5
  speech_codebooks: 1
  speech_codebook_size: 6562
  speech_depth_layers: 20
  speech_depth_heads: 12
  speech_depth_ffn_dim: 3072
  dropout: 0.0
  activation_checkpointing: true
  kv_heads: 8
  audio_dim: 1024
  audio_layers: 24
  audio_heads: 16
  audio_ffn_dim: 4096
  audio_cache_frames: 1500
  vision_dim: 1152
  vision_layers: 27
  vision_heads: 16
  vision_ffn_dim: 4304
  vision_patch_size: 14
  vision_position_grid: 70
  perceiver_dim: 2048
  perceiver_heads: 16
  perceiver_ffn_dim: 8192
  jepa_dim: 1024
  jepa_heads: 16
  jepa_ffn_dim: 4096
  speech_dim: 768
  speech_window_units: 10
  native_source_lock: ~/latentloop-data/models/minicpm-o-4_5/eb4141de24550a3a1a4082f718be58f46b761728/source-lock.json
  native_qualification: ~/latentloop-data/models/minicpm-o-4_5/eb4141de24550a3a1a4082f718be58f46b761728/qualification/qualification.json
data:
  dataset: canary
  source: webdataset
  shards: ~/latentloop-data/datasets/canary/shards/processed/train/train-*.tar
  manifest: ~/latentloop-data/datasets/canary/shards/processed/train/train-manifest.jsonl
  audio_sample_rate: 16000
  codec_frame_rate: 25.0
  codec_id: minicpm-o-4_5-s3-25hz
  codec_weight_hash: d43342aa12163a80bf07bffb94c9de2e120a8df2f9917cd2f642e7f4219c6f71
  codec_revision: eb4141de24550a3a1a4082f718be58f46b761728
  codec_codebooks: 1
  codec_codebook_size: 6562
  unit_ms: 200
  unit_audio_samples: 3200
  video_height: 448
  video_width: 448
  episode_units: 150
  train_episodes: 1000
  seed: 17
training:
  devices: [cuda:0, cuda:1, cuda:2, cuda:3, cuda:4, cuda:5, cuda:6, cuda:7]
  stage: pretrain
  max_updates: 1000
  weight_decay: 0.1
  gradient_accumulation_steps: 16
  tbptt_units: 150
  mixed_precision: bf16
  max_grad_norm: 1.0
  checkpoint_every: 250
  log_every: 1
  head_learning_rate: 0.0001
  backbone_learning_rate: 3.0e-05
  warmup_ratio: 0.03
  codec_scheduled_sampling: 0.1
  codec_scheduled_sampling_start: 0.7
  backbone_train_mode: all
  speech_loss_weight: 1.0
  jepa_loss_weight: 1.0
  memory_horizon_units: 150
  min_learning_rate_ratio: 0.1
  rl:
    policy_device: cuda:0
    reference_device: cuda:2
    candidate_devices: [cuda:3, cuda:4, cuda:5, cuda:6, cuda:7]
    algorithm: online_recurrent_ppo
    ppo_window_units: 150
    ppo_epochs: 4
    candidate_max_reference_kl: 1.0
    candidate_max_eval_loss_ratio: 1.25
    candidate_max_rejections: 3
    clip_epsilon: 0.2
    reference_kl_beta: 0.02
    environment_socket: ~/latentloop-data/runtime/canary/harness-control.sock
    reward_socket: ~/latentloop-data/runtime/canary/reward-judge.sock
    environment_id: avm-dialogue
    environment_version: '1'
    environment_protocol_version: avm-realtime-v2
    reward_spec_id: avm-dialogue-v1
    judge_model_id: external-frozen-multimodal
    judge_revision: locked-canary
    rubric_sha256: b6f942e66d31d5e8767438f55a52c51150cd9a7ae33be7c3f477c0484710e87e
    timeline_root: ~/latentloop-data/runtime/canary/timeline
    session_manifest: ~/latentloop-data/datasets/canary/rl/sessions.jsonl
    sft_replay_shards: ~/latentloop-data/datasets/canary/shards/processed/train/train-*.tar
    sft_replay_manifest: ~/latentloop-data/datasets/canary/shards/processed/train/train-manifest.jsonl
    sft_preservation_shards: ~/latentloop-data/datasets/canary/shards/processed/validation/validation-*.tar
    sft_preservation_manifest: ~/latentloop-data/datasets/canary/shards/processed/validation/validation-manifest.jsonl
    sampling_temperature: 0.8
    sampling_top_k: 0
tracking:
  enabled: true
  project: avm
  mode: online
  base_url: http://127.0.0.1:8080
  media_samples_per_run: 4
  media_warning_gb: 40
  media_stop_gb: 50
runtime:
  acoustic_cuda_device: 1
  native_acoustic_socket: ~/latentloop-data/runtime/canary/native-acoustics.sock
  data_root: ~/latentloop-data/datasets
  experiment_root: ~/latentloop-data/experiments/canary/standalone
